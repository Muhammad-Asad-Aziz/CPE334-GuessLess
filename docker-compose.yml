services:
  db:
    image: postgres:16
    container_name: guessless-db
    restart: always
    environment:
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      POSTGRES_DB: survey
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:

