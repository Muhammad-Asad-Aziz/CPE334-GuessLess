services:
  db:
    image: postgres:16
    container_name: guessless-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      POSTGRES_DB: survey
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey -d survey"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guessless-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Asia/Bangkok
      DATABASE_URL: postgresql://survey:${DB_PASSWORD:-change-me-db-password}@db:5432/survey
      JWT_SECRET: ${JWT_SECRET:-change-me-use-a-long-random-value-min-32-chars}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-60}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      SEED_PASSWORD: ${SEED_PASSWORD:-change-me-seed-password}
    command: ["sh", "-c", "npx --no-install prisma migrate deploy && npm run seed"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local-docker}
    container_name: guessless-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      TZ: Asia/Bangkok
      DATABASE_URL: postgresql://survey:${DB_PASSWORD:-change-me-db-password}@db:5432/survey
      JWT_SECRET: ${JWT_SECRET:-change-me-use-a-long-random-value-min-32-chars}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-60}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      ANON_MIN_RESPONSES: ${ANON_MIN_RESPONSES:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}

volumes:
  pgdata: